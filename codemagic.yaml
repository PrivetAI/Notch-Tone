workflows:
  ios-native-quick-start:
    name: iOS Native
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: 'Notch Tone'
    environment:
      # Подпись берётся из хранилища Codemagic (Settings → Code signing
      # identities): distribution-сертификат аккаунта Hasan AMCA лежит там
      # вместе с приватным ключом, provisioning profile «Notch Tone» выпущен
      # под этот сертификат и подтянут из портала. Один сертификат обслуживает
      # все сборки.
      #
      # Прежняя схема генерировала ключ заново на каждой сборке
      # (openssl genrsa) — сертификат оставался, а ключа к нему больше не
      # было, поэтому каждый запуск просил у Apple новый и упирался в лимит:
      # «You already have a current Distribution certificate», 409.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.hasanamca.notchtone
      vars:
        BUNDLE_ID: "com.hasanamca.notchtone"
        XCODE_WORKSPACE: "Notch Tone.xcodeproj"
        XCODE_SCHEME: "Notch Tone"
        APP_STORE_APPLE_ID: 6805241219
      xcode: latest
    scripts:
      - name: Set up provisioning profiles settings on Xcode project
        script: xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
