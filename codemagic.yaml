workflows:
  ios-native-quick-start:
    name: iOS Native
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: 'Notch Tone'
    environment:
      # Блока ios_signing здесь нет намеренно: он резолвит профиль из хранилища
      # Codemagic, а загрузить туда .mobileprovision невозможно — компонент
      # загрузки не реагирует на файлы. Подпись целиком делаем скриптами.
      vars:
        BUNDLE_ID: "com.hasanamca.notchtone"
        XCODE_WORKSPACE: "Notch Tone.xcodeproj"
        XCODE_SCHEME: "Notch Tone"
      xcode: latest
    scripts:
      # CERTIFICATE_PRIVATE_KEY приходит переменной сборки при запуске через
      # API и в репозитории не хранится. APP_STORE_CONNECT_* подставляет
      # интеграция выше.
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up provisioning profiles settings on Xcode project
        script: xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
