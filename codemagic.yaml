workflows:
  ios-native-quick-start:
    name: iOS Native
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: 'Notch Tone'
    environment:
      # Блока ios_signing здесь намеренно нет: он резолвит профиль из хранилища
      # Codemagic и падает с «No matching profiles found», а положить туда
      # .mobileprovision через интерфейс не выходит. Подпись делаем скриптами —
      # эта схема прошла на пяти приложениях прошлой партии.
      vars:
        BUNDLE_ID: "com.hasanamca.notchtone"
        XCODE_WORKSPACE: "Notch Tone.xcodeproj"
        XCODE_SCHEME: "Notch Tone"
        APP_STORE_APPLE_ID: 6805241219
      xcode: latest
    scripts:
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          # Ключ для сертификата создаём прямо в сборке: секрет не лежит ни в
          # репозитории, ни в переменных Codemagic. Раньше он приходил
          # переменной CERTIFICATE_PRIVATE_KEY при запуске через API, и запуск
          # из интерфейса падал на «Cannot save Signing Certificates without
          # certificate private key».
          # Приватный ключ рождается заново на каждой сборке, поэтому ранее
          # выпущенные distribution-сертификаты бесполезны — их ключи
          # недоступны. Apple держит лимит два на аккаунт, и без уборки каждая
          # вторая сборка падает с 409 «You already have a current Distribution
          # certificate». Отзываем старые перед выпуском нового; на уже
          # загруженные в App Store Connect билды это не влияет.
          python3 - <<'CLEANUP'
          import json, subprocess
          ids = set()
          for cert_type in ("DISTRIBUTION", "IOS_DISTRIBUTION"):
              out = subprocess.run(
                  ["app-store-connect", "certificates", "list", "--type", cert_type, "--json"],
                  capture_output=True, text=True)
              try:
                  ids.update(c["id"] for c in json.loads(out.stdout or "[]"))
              except Exception:
                  pass
          for cert_id in sorted(ids):
              print("revoking certificate", cert_id)
              subprocess.run(["app-store-connect", "certificates", "delete", cert_id, "--ignore-not-found"])
          CLEANUP
          openssl genrsa 2048 | openssl pkcs8 -topk8 -nocrypt -out /tmp/signing_key.pem
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/signing_key.pem \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up provisioning profiles settings on Xcode project
        script: xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
